<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2B Lead Engine v2 | Franco Consulting</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="A/B Variante v2 fuer B2B mit minimalem Funnel und fokussierter Conversion-Page.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-industry="b2b" data-variant="branche_y_v2" data-form-version="b2b_form_v2">
  <main class="container">
    <section class="intro">
      <a href="../">Alle Varianten</a>
      <a href="../v1/">Zu v1</a>
      <h1>B2B Pipeline Booster</h1>
      <p>Diese Variante reduziert Ablenkung und fuehrt Besucher direkt in einen kompakten Anfrageflow.</p>
    </section>

    <section class="form-card">
      <h2>Erstgespraech anfragen</h2>
      <form id="contactForm" novalidate>
        <label>Zielsegment
          <select name="need" required>
            <option value="">Bitte auswaehlen</option>
            <option>Enterprise</option>
            <option>Mid-Market</option>
            <option>SMB</option>
          </select>
        </label>
        <label>Werbebudget
          <select name="budget" required>
            <option value="">Bitte auswaehlen</option>
            <option value="2500">2.500 EUR</option>
            <option value="7500">7.500 EUR</option>
            <option value="15000">15.000 EUR</option>
            <option value="30000">30.000 EUR+</option>
          </select>
        </label>
        <label>Start
          <select name="timeline" required>
            <option value="">Bitte auswaehlen</option>
            <option>Sofort</option>
            <option>Naechste 4 Wochen</option>
            <option>Naechstes Quartal</option>
          </select>
        </label>
        <label>Projektbeschreibung
          <textarea name="message" rows="4" required></textarea>
        </label>
        <label>Name
          <input name="fullname" type="text" required>
        </label>
        <label>Firma
          <input name="company" type="text" required>
        </label>
        <label>Rolle
          <input name="role" type="text" required>
        </label>
        <label>Telefon
          <input name="phone" type="tel" required>
        </label>
        <label>E-Mail
          <input name="email" type="email" required>
        </label>
        <label class="inline"><input name="bookedAppointment" type="checkbox"><span>Direkt Termin anfragen</span></label>
        <button type="submit">Anfrage absenden</button>
        <p id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <a href="/datenschutz">Datenschutz</a>
    <a href="/impressum">Impressum</a>
    <button id="cookieSettings" type="button">Cookies</button>
  </footer>

  <div id="cookieBanner" class="cookie-banner">
    <p>Cookies fuer Kampagnenmessung zulassen?</p>
    <button id="cookieAcceptAll" type="button">Akzeptieren</button>
    <button id="cookieDeclineAll" type="button">Ablehnen</button>
  </div>
  <div id="cookieSettingsModal" class="cookie-modal">
    <div class="cookie-modal-content">
      <button id="cookieModalClose" type="button">Schliessen</button>
      <label class="inline"><input id="cookieMarketing" type="checkbox"><span>Marketing erlauben</span></label>
      <button id="cookieSaveSettings" type="button">Speichern</button>
      <button id="cookieAcceptAllModal" type="button">Alle akzeptieren</button>
    </div>
  </div>

  <script src="../../../shared/js/analytics.js"></script>
  <script src="../../../shared/js/consent.js"></script>
  <script src="../../../shared/js/form-api.js"></script>
  <script src="./script.js"></script>
</body>
</html>
